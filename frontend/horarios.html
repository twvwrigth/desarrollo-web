<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbería — Horarios del barbero</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Barbería</h1>
    <nav>
      <a href="index.html">Servicios</a>
      <a href="agendar.html">Agendar cita</a>
      <a href="resenas.html">Reseñas</a>
      <a href="login.html">Iniciar sesión</a>
      <a href="registro.html">Registro</a>
      <a href="usuarios.html">Usuarios</a>
      <a href="horarios.html" class="activo">Horarios</a>
    </nav>
    <span id="sesion-info" class="sesion"></span>
  </header>

  <main>
    <h2>Horarios del barbero</h2>

    <section class="card">
      <h3>Elegir barbero</h3>
      <form id="form-elegir-barbero" class="form-inline">
        <label>
          Barbero
          <select id="horario-barbero-id" required>
            <option value="">Cargando barberos…</option>
          </select>
        </label>
        <button type="submit" class="btn">Ver horarios</button>
      </form>
      <p id="mensaje-lista-horarios" class="mensaje" aria-live="polite"></p>
      <div class="tabla-scroll">
        <table class="tabla">
          <thead>
            <tr><th>Día</th><th>Inicio</th><th>Fin</th><th>Acciones</th></tr>
          </thead>
          <tbody id="cuerpo-horarios" aria-live="polite">
            <tr><td colspan="4">Elige un barbero para ver sus horarios.</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h3>Crear horario</h3>
      <form id="form-horario" class="form">
        <label>
          Día de la semana
          <select id="horario-dia" required>
            <option value="1">Lunes</option>
            <option value="2">Martes</option>
            <option value="3">Miércoles</option>
            <option value="4">Jueves</option>
            <option value="5">Viernes</option>
            <option value="6">Sábado</option>
            <option value="7">Domingo</option>
          </select>
        </label>
        <label>
          Hora de inicio
          <input type="time" id="horario-inicio" required>
        </label>
        <label>
          Hora de fin
          <input type="time" id="horario-fin" required>
        </label>
        <button type="submit" class="btn">Crear horario</button>
        <p id="mensaje-horario" class="mensaje" aria-live="polite"></p>
      </form>
    </section>

    <section class="card" id="seccion-editar-horario" style="display: none;">
      <h3>Editar horario</h3>
      <form id="form-editar-horario" class="form">
        <input type="hidden" id="editar-horario-id">
        <label>
          Día de la semana
          <select id="editar-horario-dia" required>
            <option value="1">Lunes</option>
            <option value="2">Martes</option>
            <option value="3">Miércoles</option>
            <option value="4">Jueves</option>
            <option value="5">Viernes</option>
            <option value="6">Sábado</option>
            <option value="7">Domingo</option>
          </select>
        </label>
        <label>
          Hora de inicio
          <input type="time" id="editar-horario-inicio" required>
        </label>
        <label>
          Hora de fin
          <input type="time" id="editar-horario-fin" required>
        </label>
        <button type="submit" class="btn">Guardar cambios</button>
        <button type="button" class="btn btn-secundario" id="btn-cancelar-editar-horario">Cancelar</button>
        <p id="mensaje-editar-horario" class="mensaje" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>Proyecto desarrollo-web — UV</p>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/usuarios.js"></script>
  <script src="js/horarios.js"></script>
  <script>
    pintarSesion();
    document.getElementById('form-elegir-barbero').addEventListener('submit', function (e) {
      e.preventDefault();
      cargarHorarios();
    });
    document.getElementById('form-horario').addEventListener('submit', crearHorario);
    document.getElementById('form-editar-horario').addEventListener('submit', guardarEdicionHorario);
    document.getElementById('btn-cancelar-editar-horario').addEventListener('click', function () {
      document.getElementById('seccion-editar-horario').style.display = 'none';
    });
    cargarBarberosHorarios();
  </script>
</body>
</html>
