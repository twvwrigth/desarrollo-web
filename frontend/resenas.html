<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbería — Reseñas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header class="topbar">
    <h1>Barbería</h1>
    <nav>
      <a href="index.html">Servicios</a>
      <a href="agendar.html">Agendar cita</a>
      <a href="resenas.html" class="activo">Reseñas</a>
      <a href="servicios.html">Gestión Servicios</a>
      <a href="cotizaciones.html">Cotizaciones</a>
      <a href="login.html" id="nav-login">Iniciar sesión</a>
      <a href="registro.html" id="nav-registro">Registro</a>
      <a href="usuarios.html" id="nav-usuarios">Usuarios</a>
      <a href="horarios.html" id="nav-horarios">Horarios</a>
    </nav>
    <span id="sesion-info" class="sesion"></span>
    <button type="button" class="btn btn-secundario" id="btn-cerrar-sesion" style="display: none;">Cerrar sesión</button>
  </header>

  <main>
    <h2>Reseñas</h2>

    <section class="card">
      <h3>Ver reseñas de un barbero</h3>
      <form id="form-buscar" class="form-inline">
        <label>
          Barbero
          <select id="buscar-barbero-select">
            <option value="">— todos —</option>
          </select>
        </label>
        <label>
          ID del barbero
          <input type="number" id="buscar-barbero-id" min="1" placeholder="Ej. 3">
        </label>
        <button type="submit" class="btn">Buscar</button>
        <button type="button" class="btn btn-secundario" id="btn-todas">Ver todas</button>
      </form>
      <!-- Resumen del barbero (GET /api/resenas/resumen?barberoId=, E3). -->
      <p id="resumen-barbero" class="resumen" aria-live="polite"></p>
      <p id="mensaje-lista" class="mensaje" aria-live="polite"></p>
      <!-- E4: las reseñas se muestran en TABLA, no en lista. -->
      <div class="tabla-scroll">
        <table class="tabla">
          <thead>
            <tr>
              <th>Cita</th>
              <th>Calificación</th>
              <th>Comentario</th>
              <th>Fecha</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="cuerpo-resenas" aria-live="polite">
            <tr>
              <td colspan="5">Cargando reseñas…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- Formulario de edición, oculto hasta pulsar "Editar" en una reseña. -->
    <section class="card" id="form-editar-resena" style="display: none;">
      <h3>Editar reseña</h3>
      <form id="form-editar" class="form">
        <input type="hidden" id="editar-resena-id">
        <label>
          Calificación (1 a 5)
          <select id="editar-calificacion" required>
            <option value="5">★★★★★ — 5</option>
            <option value="4">★★★★☆ — 4</option>
            <option value="3">★★★☆☆ — 3</option>
            <option value="2">★★☆☆☆ — 2</option>
            <option value="1">★☆☆☆☆ — 1</option>
          </select>
        </label>
        <label>
          Comentario
          <textarea id="editar-comentario" rows="3"></textarea>
        </label>
        <button type="submit" class="btn">Guardar cambios</button>
        <button type="button" class="btn btn-secundario" id="btn-cancelar-editar">Cancelar</button>
        <p id="mensaje-editar" class="mensaje" aria-live="polite"></p>
      </form>
    </section>

    <section class="card">
      <h3>Dejar una reseña</h3>
      <form id="form-resena" class="form">
        <label>
          ID de la cita
          <input type="number" id="cita-id" min="1" required placeholder="Ej. 1">
        </label>
        <label>
          Tu ID de cliente (si no hay sesión guardada, se envía como X-Usuario-Id)
          <input type="number" id="usuario-id" min="1" placeholder="Ej. 2">
        </label>
        <label>
          Calificación (1 a 5)
          <select id="calificacion" required>
            <option value="">Elige…</option>
            <option value="5">★★★★★ — 5</option>
            <option value="4">★★★★☆ — 4</option>
            <option value="3">★★★☆☆ — 3</option>
            <option value="2">★★☆☆☆ — 2</option>
            <option value="1">★☆☆☆☆ — 1</option>
          </select>
        </label>
        <label>
          Comentario
          <textarea id="comentario" rows="3" placeholder="Excelente corte y buen trato"></textarea>
        </label>
        <button type="submit" class="btn">Enviar reseña</button>
        <p id="mensaje-resena" class="mensaje" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>Proyecto desarrollo-web</p>
  </footer>

  <script src="js/common.js"></script>
  <script src="js/resenas.js"></script>
  <script src="js/usuarios.js"></script>

  <script>
    mostrarSesion();
    document.getElementById('form-buscar').addEventListener('submit', buscarResenas);
    document.getElementById('btn-todas').addEventListener('click', listarTodasResenas);
    document.getElementById('form-resena').addEventListener('submit', enviarResena);
    document.getElementById('form-editar').addEventListener('submit', guardarEdicionResena);
    document.getElementById('btn-cancelar-editar').addEventListener('click', function () {
      document.getElementById('form-editar-resena').style.display = 'none';
    });
    listarTodasResenas();
    precargarDatosResena();
    cargarBarberosParaResenas();
    document.getElementById('buscar-barbero-select').addEventListener('change', function () {
      document.getElementById('buscar-barbero-id').value = this.value;
      if (this.value) {
        listarResenas(Number(this.value));
      } else {
        listarTodasResenas();
      }
    });
  </script>
</body>

</html>
