<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbería — Iniciar sesión</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Barbería</h1>
    <nav>
      <a href="index.html">Servicios</a>
      <a href="agendar.html">Agendar cita</a>
      <a href="resenas.html">Reseñas</a>
      <a href="servicios.html">Gestión Servicios</a>
      <a href="cotizaciones.html">Cotizaciones</a>
      <a href="login.html" id="nav-login" class="activo">Iniciar sesión</a>
      <a href="registro.html" id="nav-registro">Registro</a>
      <a href="usuarios.html" id="nav-usuarios">Usuarios</a>
      <a href="horarios.html" id="nav-horarios">Horarios</a>
    </nav>
    <span id="sesion-info" class="sesion"></span>
    <button type="button" class="btn btn-secundario" id="btn-cerrar-sesion" style="display: none;">Cerrar sesión</button>
  </header>

  <main>
    <h2>Iniciar sesión</h2>

    <form id="form-login" class="card form">
      <label>
        Email
        <input type="email" id="login-email" required placeholder="Ej. admin@barberia.com">
      </label>
      <label>
        Contraseña
        <input type="password" id="login-password" required placeholder="Tu contraseña">
      </label>
      <button type="submit" class="btn">Entrar</button>
      <p id="mensaje-login" class="mensaje" aria-live="polite"></p>
    </form>

    <section class="card">
      <h3>Sesión actual</h3>
      <p id="sesion-actual" class="nota">No hay sesión activa.</p>
      <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>.</p>
    </section>
  </main>

  <footer>
    <p>Proyecto desarrollo-web</p>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/usuarios.js"></script>
  <script>
    pintarSesion();
    document.getElementById('form-login').addEventListener('submit', function (event) {
      var habiaSesion = sesionUsuarioId();
      iniciarSesion(event).then(function () {
        if (!habiaSesion && sesionUsuarioId()) {
          setTimeout(function () { window.location.href = 'index.html'; }, 900);
        }
      });
    });
  </script>
</body>
</html>
