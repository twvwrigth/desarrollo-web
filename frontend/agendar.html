<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbería — Agendar cita</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header class="topbar">
    <h1>Barbería</h1>
    <nav>
      <a href="index.html">Servicios</a>
      <a href="agendar.html" class="activo">Agendar cita</a>
      <a href="resenas.html">Reseñas</a>
    </nav>
  </header>

  <main>
    <h2>Agendar cita</h2>

    <form id="form-cita" class="card form">
      <label>
        Tu ID de cliente
        <input type="number" id="cliente-id" min="1" required placeholder="Ej. 4">
      </label>
      <label>
        ID del barbero
        <input type="number" id="barbero-id" min="1" required placeholder="Ej. 2">
      </label>
      <label>
        Servicio
        <select id="servicio-id" required>
          <option value="1">Corte clásico — 30 min · $150</option>
          <option value="2">Corte + barba — 45 min · $200</option>
          <option value="3">Afeitado clásico — 20 min · $120</option>
        </select>
      </label>
      <label>
        ID del corte
        <input type="number" id="corte-id" min="1" required placeholder="Ej. 1">
      </label>
      <label>
        Fecha y hora de inicio
        <input type="datetime-local" id="fecha-hora" required>
      </label>
      <label>
        Fecha y hora de fin
        <input type="datetime-local" id="fecha-hora-fin" required>
      </label>
      <label>
        Observaciones / notas
        <textarea id="notas-cita" rows="2" placeholder="Sin máquina en las patillas"></textarea>
      </label>
      <button type="submit" class="btn">Agendar</button>
      <p id="mensaje-cita" class="mensaje" aria-live="polite"></p>
    </form>

    <section class="card">
      <h3>Mis citas</h3>
      <form id="form-filtro-citas" class="form-inline">
        <label>
          ID del cliente
          <input type="number" id="filtro-cliente-id" min="1" placeholder="Ej. 4">
        </label>
        <label>
          Estado
          <select id="filtro-estado">
            <option value="">Todos</option>
            <option value="PENDIENTE">Pendiente</option>
            <option value="CONFIRMADA">Confirmada</option>
            <option value="COMPLETADA">Completada</option>
            <option value="CANCELADA">Cancelada</option>
          </select>
        </label>
        <button type="submit" class="btn">Buscar</button>
      </form>
      <p id="mensaje-citas" class="mensaje" aria-live="polite"></p>
      <ul id="lista-citas" class="lista-resenas"></ul>
    </section>
    
    <section class="card" id="form-reprogramar" style="display: none;">
      <h3>Reprogramar cita</h3>
      <form id="form-reprogramar-cita" class="form">
        <input type="hidden" id="reprogramar-cita-id">
        <label>
          Nueva fecha y hora de inicio
          <input type="datetime-local" id="reprogramar-inicio" required>
        </label>
        <label>
          Nueva fecha y hora de fin
          <input type="datetime-local" id="reprogramar-fin" required>
        </label>
        <label>
          Observaciones / notas
          <textarea id="reprogramar-notas" rows="2"></textarea>
        </label>
        <button type="submit" class="btn">Guardar nueva fecha</button>
        <button type="button" class="btn btn-secundario" id="btn-cancelar-reprogramar">Cancelar</button>
        <p id="mensaje-reprogramar" class="mensaje" aria-live="polite"></p>
      </form>
    </section>

    <section class="card" id="form-cambiar-estado" style="display: none;">
      <h3 id="titulo-estado-cita">Cambiar estado de la cita</h3>
      <form id="form-estado-cita" class="form">
        <input type="hidden" id="estado-cita-id">
        <label>
          Nuevo estado
          <select id="estado-nuevo" required></select>
        </label>
        <p class="nota">Solo el cliente, el barbero o un admin pueden cambiar el estado. Se manda tu ID de cliente del filtro de "Mis citas" como X-Usuario-Id.</p>
        <button type="submit" class="btn">Guardar estado</button>
        <button type="button" class="btn btn-secundario" id="btn-cancelar-estado">Cancelar</button>
        <p id="mensaje-estado" class="mensaje" aria-live="polite"></p>
      </form>
    </section>

  </main>
  <script src="js/app.js"></script>
  <script src="js/citas.js"></script>
  <script>
    document.getElementById('form-cita').addEventListener('submit', agendarCita);
    document.getElementById('form-filtro-citas').addEventListener('submit', function (e) {
      e.preventDefault();
      listarMisCitas();
    });
    document.getElementById('form-reprogramar-cita').addEventListener('submit', guardarReprogramacion);
    document.getElementById('btn-cancelar-reprogramar').addEventListener('click', function () {
      document.getElementById('form-reprogramar').style.display = 'none';
    });
    document.getElementById('form-estado-cita').addEventListener('submit', guardarCambioEstadoCita);
    document.getElementById('btn-cancelar-estado').addEventListener('click', function () {
      document.getElementById('form-cambiar-estado').style.display = 'none';
    });
  </script>
</body>

</html>
